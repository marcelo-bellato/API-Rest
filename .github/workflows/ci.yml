name: Java CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Java 17 para compilar e executar os testes
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      # Testes + JaCoCo
      - name: Build and Test
        run: ./mvnw -B clean verify

      # Publica relatório JaCoCo como artifact
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      # Mutation Testing
      - name: Mutation Testing
        run: ./mvnw -B org.pitest:pitest-maven:mutationCoverage -Ppitest

      # Publica relatório do PIT como artifact
      - name: Upload PIT report
        uses: actions/upload-artifact@v4
        with:
          name: pit-mutation-report
          path: target/pit-reports/
          retention-days: 7

      # Java 21 para análise do SonarCloud
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java Version
        run: |
          java -version
          ./mvnw -version

      # SonarCloud + Quality Gate
      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=marcelo-bellato_API-Rest \
            -Dsonar.organization=marcelo-bellato \
            -Dsonar.qualitygate.wait=true
