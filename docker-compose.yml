services:

  postgres:
    image: postgres:16-alpine
    container_name: api-rest-postgres
    environment:
      POSTGRES_DB: apidb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apidb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: api-rest
    ports:
      - "8080:8082"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: